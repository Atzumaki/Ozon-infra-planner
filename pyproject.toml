[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-capacity-planner"
version = "0.1.0"
description = "Forecasting and optimization service for data-center capacity planning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atzumaki" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
infra-planner = "infra_planner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_planner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

